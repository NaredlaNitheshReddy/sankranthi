# Analyzer configuration for Sankranthi.
#
# The three `language:` flags are deliberate: this project passes untyped
# `Map<String, Object?>` rows across the sync seam, and without strict-casts an
# implicit downcast there fails at runtime on a partner's phone rather than in
# CI. See CLAUDE.md.

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    # A dropped Future in the sync engine is a silently unsent record, not a
    # style nit. Promote it to an error.
    unawaited_futures: error
    # BuildContext across an await gap crashes after a route pops.
    use_build_context_synchronously: error
    # Anything the analyzer can prove dead is a bug or a leftover.
    dead_code: error
    unused_import: error
    unused_local_variable: error

  exclude:
    - "**/*.g.dart"
    - "**/*.drift.dart"
    - "build/**"

linter:
  rules:
    # Correctness
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - only_throw_errors
    - test_types_in_equals
    - throw_in_finally
    - unnecessary_statements

    # Async discipline -- load-bearing for the sync engine
    - discarded_futures
    - unawaited_futures

    # Immutability / clarity
    - prefer_final_locals
    - prefer_final_in_for_each
    - use_super_parameters
    - sort_constructors_first

    # Money and dates are never interpolated ad hoc; see MoneyText in CLAUDE.md
    - avoid_escaping_inner_quotes
